<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOUR NAME — Analog Archive</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- Analog Layers -->
<div class="scanlines"></div>
<div class="grain"></div>
<div class="flicker" aria-hidden="true"></div>

<header class="site-header">
  <h1 class="logo">YOUR NAME</h1>

  <nav class="filters" aria-label="Category filters">
    <button data-filter="all" class="active">ALL</button>
    <button data-filter="photo">PHOTO</button>
    <button data-filter="video">VIDEO</button>
    <button data-filter="design">DESIGN</button>
  </nav>
</header>

<main class="wrap">
  <section class="grid" aria-label="Projects">

    <!-- PHOTO -->
    <article class="card" data-category="photo" data-type="image" data-src="assets/photo1.jpg" data-title="Urban Silence">
      <div class="media">
        <img src="assets/photo1.jpg" alt="Urban Silence thumbnail" />
        <div class="hud">
          <span class="label">PLAY ▷</span>
          <span class="tc">00:00:00</span>
        </div>
      </div>
      <h2>Urban Silence</h2>
    </article>

    <!-- VIDEO (thumbnail opens video iframe in modal) -->
    <article class="card" data-category="video" data-type="video" data-src="https://www.youtube.com/embed/dQw4w9WgXcQ" data-title="Motion Study">
      <div class="media">
        <img src="assets/video1.jpg" alt="Motion Study thumbnail" />
        <div class="hud rec">
          <span class="label">REC ●</span>
          <span class="tc">00:00:00</span>
        </div>
      </div>
      <h2>Motion Study</h2>
    </article>

    <!-- DESIGN -->
    <article class="card" data-category="design" data-type="image" data-src="assets/design1.jpg" data-title="Minimal Identity">
      <div class="media">
        <img src="assets/design1.jpg" alt="Minimal Identity thumbnail" />
        <div class="hud">
          <span class="label">PLAY ▷</span>
          <span class="tc">00:00:00</span>
        </div>
      </div>
      <h2>Minimal Identity</h2>
    </article>

    <!-- Add more cards by duplicating -->
  </section>
</main>

<footer class="site-footer">
  <p>© 2026 YOUR NAME — Analog Archive</p>
</footer>

<!-- Lightbox / Modal -->
<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-label="Project viewer">
  <div class="modal-backdrop" data-close="true"></div>

  <div class="modal-frame" role="document">
    <div class="modal-bar">
      <div class="modal-title" id="modalTitle">TITLE</div>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>

    <div class="modal-body" id="modalBody">
      <!-- Injected media -->
    </div>

    <div class="modal-hud">
      <span id="modalMode">PLAY ▷</span>
      <span id="modalTC">00:00:00</span>
      <span class="right">SP • EP</span>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
